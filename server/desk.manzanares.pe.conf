# ==============================================================================
# Configuración Nginx para VisionDesk: desk.manzanares.pe
# Ubicación en tu servidor: /etc/nginx/conf.d/desk.manzanares.pe.conf
#
# Compatible con:
# - Ubuntu Server 22.04 LTS
# - Cloudflare (Proxy SSL / Modo Full o Flexible)
# - Certbot Let's Encrypt
# - WebSockets continuos para thumbnails cada 5s y streaming interactivo
# ==============================================================================

upstream visiondesk_backend {
    server 127.0.0.1:8090;
    keepalive 32;
}

# 1. Redirección HTTP a HTTPS
server {
    listen 80;
    server_name desk.manzanares.pe;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Servidor Seguro HTTPS y WebSockets Relay
server {
    listen 443 ssl http2;
    server_name desk.manzanares.pe;

    # Certificados SSL emitidos por Certbot
    ssl_certificate /etc/letsencrypt/live/desk.manzanares.pe/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/desk.manzanares.pe/privkey.pem;

    # Protocolos y Cifrados seguros (idénticos a tu configuración de evolution.manzanares.pe)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    # Tamaño máximo de carga (para miniaturas y transferencias)
    client_max_body_size 64M;

    location / {
        proxy_pass http://visiondesk_backend;
        proxy_http_version 1.1;

        # Cabeceras obligatorias para WebSockets (/ws y /ws/relay)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Cabeceras de host y dirección real detrás de Cloudflare
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts extendidos para conexiones WebSocket persistentes sin cortes
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
    }
}
