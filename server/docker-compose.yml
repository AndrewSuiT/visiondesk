services:
  visiondesk-server:
    container_name: visiondesk-server
    build:
      context: .
      dockerfile: Dockerfile
    image: visiondesk-server:1.0.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8090}:8080"
    volumes:
      - ./public:/app/public:ro
      - ./server.js:/app/server.js:ro
      - ./registry.js:/app/registry.js:ro
      - ./relay.js:/app/relay.js:ro
    environment:
      - PORT=8080
      - RELAY_PORT=${RELAY_PORT:-8080}
      - HOST=0.0.0.0
      - NODE_ENV=production
      - ADMIN_TOKEN=${ADMIN_TOKEN:-vd-master-token-aqp-production-key-2026}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-AdminVisionDesk2026!}
      - PING_INTERVAL_MS=${PING_INTERVAL_MS:-5000}
      - PING_TIMEOUT_MS=${PING_TIMEOUT_MS:-15000}
      - THUMBNAIL_MAX_KB=${THUMBNAIL_MAX_KB:-60}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # WebRTC Hybrid Transport & ICE Provisioning
      - STUN_SERVERS=${STUN_SERVERS:-stun:stun.l.google.com:19302,stun:stun1.l.google.com:19302}
      - TURN_URL=${TURN_URL:-turn:turn.manzanares.pe:3478}
      - TURN_USERNAME=${TURN_USERNAME:-visiondesk}
      - TURN_CREDENTIAL=${TURN_CREDENTIAL:-TurnArequipa2026!}
      - ICE_TRANSPORT_POLICY=${ICE_TRANSPORT_POLICY:-all}
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 20M
    # Direct resource limits for legacy docker-compose compatibility
    mem_limit: 64M
    mem_reservation: 20M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  coturn:
    image: coturn/coturn:latest
    container_name: visiondesk-coturn
    restart: unless-stopped
    profiles: ["turn", "coturn", "all"]
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    environment:
      - TURN_PORT=${COTURN_PORT:-3478}
      - TURN_USERNAME=${TURN_USERNAME:-visiondesk}
      - TURN_CREDENTIAL=${TURN_CREDENTIAL:-TurnArequipa2026!}
      - TURN_REALM=${TURN_REALM:-turn.manzanares.pe}
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --fingerprint
      - --lt-cred-mech
      - --realm=${TURN_REALM:-turn.manzanares.pe}
      - --user=${TURN_USERNAME:-visiondesk}:${TURN_CREDENTIAL:-TurnArequipa2026!}
      - --min-port=49160
      - --max-port=49200
      - --no-cli
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M
    mem_limit: 64M
    mem_reservation: 16M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

